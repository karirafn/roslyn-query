name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73  # v6.1.0
        with:
          dotnet-version: '10.x'
          include-prerelease: true

      - name: Build
        run: dotnet build roslyn-query.slnx --no-incremental

      - name: Test
        run: dotnet test roslyn-query.slnx --no-build

  # Single stable check name for the branch ruleset; matrix job names include the OS.
  build:
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require all matrix jobs to succeed
        if: needs.test.result != 'success'
        run: |
          echo "test matrix result: ${{ needs.test.result }}"
          exit 1
