name: publish

on:
  push:
    tags: ['release-*']

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
        with:
          dotnet-version: '10.x'

      - name: Extract version from tag
        id: version
        run: echo "value=${GITHUB_REF_NAME#release-}" >> "$GITHUB_OUTPUT"

      - name: Build
        run: dotnet build roslyn-query.slnx -c Release --no-incremental

      - name: Test
        run: dotnet test roslyn-query.slnx -c Release --no-build

      - name: Pack
        run: dotnet pack src/roslyn-query.csproj -c Release -p:Version=${{ steps.version.outputs.value }} --no-build -o ./artifacts

      - name: NuGet login (Trusted Publishing)
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841  # v1.2.0
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet
        run: dotnet nuget push ./artifacts/*.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json
